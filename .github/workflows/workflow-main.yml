name: PROD - Test & Release .NET Application

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release-job:
    runs-on: windows-latest

    steps:
      - name: Check .NET version
        run: |
          dotnet --version
          dotnet --info

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if the last commit is a merge from develop
        id: check_merge
        run: |
          # SHA dell'ultimo commit su main
          $LAST_COMMIT = (git rev-parse HEAD).Trim()
          Write-Output "⚠️ HEAD: $LAST_COMMIT"

          # conta i parent (se sono 2 parent -> merge commit)
          $PARENTS = (git rev-list --parents -n 1 $LAST_COMMIT).Split(" ")
          Write-Output "⚠️ Parents: $PARENTS"

          $parts = $PARENTS -split ' '
          if ($parts.Count -ne 3) {
              Write-Output "❌ The last commit is not a merge from develop. Stopping the workflow."
              "MERGE_FROM_DEVELOP=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              exit 0
          }

          # Il secondo parent è la punta del ramo unito (staging): deve già far parte della storia di develop. Non si
          # confronta con la testa ATTUALE di develop: può essere avanzata dopo il merge e il rilascio salterebbe.
          $merged = $parts[2]
          git fetch origin develop
          git merge-base --is-ancestor $merged origin/develop
          if ($LASTEXITCODE -eq 0) {
              Write-Output "✅ The last commit is a merge of $merged, which is part of develop."
              "MERGE_FROM_DEVELOP=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              "MERGED_SHA=$merged" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
              Write-Output "❌ The merged commit $merged is not part of develop. Stopping the workflow."
              "MERGE_FROM_DEVELOP=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          exit 0

      - name: Set up .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Restore dependencies
        run: dotnet restore DatabaseMigrator.sln
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Build solution (Release)
        run: dotnet build DatabaseMigrator.sln --configuration Release --no-restore
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Run unit tests
        run: dotnet test DatabaseMigrator.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Publish application (win-x64)
        run: |
          dotnet publish src/DatabaseMigrator/DatabaseMigrator.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained `
            --output ./publish
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Create release notes
        run: |
          echo "# DatabaseMigrator - Production Release" > RELEASE_NOTES.txt
          echo "" >> RELEASE_NOTES.txt
          echo "## Production Release" >> RELEASE_NOTES.txt
          echo "This is a stable production release." >> RELEASE_NOTES.txt
          echo "" >> RELEASE_NOTES.txt
          echo "## Build Information:" >> RELEASE_NOTES.txt
          echo "- .NET 10.0" >> RELEASE_NOTES.txt
          echo "- Platform: Windows x64 (win-x64)" >> RELEASE_NOTES.txt
          echo "- Self-contained executable" >> RELEASE_NOTES.txt
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Get dev tag of the merged commit
        id: get_tag
        run: |
          git fetch --tags
          # La versione è quella del tag -dev che punta al commit unito. Non l'ultimo tag -dev in assoluto: dopo un nuovo
          # push su develop apparterrebbe a un altro commit e il rilascio porterebbe il numero sbagliato.
          $devTags = @(git tag --list "v*-dev" --points-at $env:MERGED_SHA | Sort-Object {[version]($_.TrimStart("v") -replace "-dev","")} -Descending)
          if ($devTags.Count -eq 0) {
            Write-Error "❌ No -dev tag points at commit ${env:MERGED_SHA}: the DEV workflow has not tagged it. Wait for the DEV run of that commit (re-run it if it failed), then re-run this workflow."
            exit 1
          }

          $lastDevTag = $devTags[0]
          Write-Output "✅ Dev tag of the merged commit: $lastDevTag"

          # tolgo il suffisso -dev
          $releaseVersion = $lastDevTag -replace "-dev",""
          Write-Output "⚠️ Versione che verrà usata --> $releaseVersion"
          $releaseTag = "$releaseVersion"

          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Mai pubblicare sopra una release che esiste già: gli asset verrebbero sostituiti con quelli di un altro commit.
          # Un tag senza release (un tentativo fermato dopo aver creato il tag) non si sistema da solo: si cancella a mano.
          git ls-remote --exit-code --tags origin "refs/tags/$releaseTag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "❌ Tag $releaseTag already exists: nothing is published over it. If an earlier run stopped before the release was created, delete the tag (git push origin :refs/tags/$releaseTag) and re-run this workflow."
            exit 1
          }
          exit 0
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Create and push tag
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag ${{ env.release_tag }}
          git push origin ${{ env.release_tag }}
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Fetch tag locally and verify
        run: |
          echo "Fetching all tags from remote..."
          git fetch origin --tags

          echo "Verifying tag ${{ env.release_tag }} exists locally..."
          if (git tag --list | Select-String -Pattern "^${{ env.release_tag }}$") {
            Write-Output "✅ Tag ${{ env.release_tag }} successfully created and available locally"
          } else {
            Write-Output "❌ Tag ${{ env.release_tag }} not found locally"
            exit 1
          }

          echo "All local tags:"
          git tag --list
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        if: env.MERGE_FROM_DEVELOP == 'true'

      - name: Create Release with changelog and assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          name: Release ${{ env.release_tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            ./publish/DatabaseMigrator.exe
            ./RELEASE_NOTES.txt
            ./README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.MERGE_FROM_DEVELOP == 'true'
