name: E2E Cross-DB Matrix

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  e2e-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run cross-database E2E matrix script
        shell: pwsh
        run: ./scripts/run-e2e-matrix.ps1
